[package]
name = "rsdu"
version = "0.1.2"
edition = "2024"
rust-version = "1.85"
description = "Fast disk usage analyzer with a terminal UI, a Rust port of ncdu"
license = "MIT"
repository = "https://github.com/awaiden/rsdu"
readme = "README.md"
keywords = ["disk-usage", "tui", "cli", "du", "ncdu"]
categories = ["command-line-utilities", "filesystem"]

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
ratatui = "0.30.2"
rayon = "1.12.0"
regex = "1.13.1"
rustix = { version = "1.1.6", features = ["fs", "process"] }
serde_json = "1.0.154"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
